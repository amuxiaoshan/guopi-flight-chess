<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f8f5"><title>适得棋所</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#27292e;--ink:#27292e;--muted:#878b91;--line:#e4e5e8;--red:#e55c5c;--yellow:#e1b747;--blue:#528bd8;--green:#59aa78;background:#f3f3f0}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.4;cursor:default}main{max-width:450px;margin:auto;background:#fff;min-height:100svh;box-shadow:0 3px 26px #00000009}.screen{display:none;min-height:100svh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);flex-direction:column}.screen.active{display:flex}.primary,.secondary{min-height:48px;padding:12px 15px;border-radius:12px}.primary{background:#33373d;color:#fff}.secondary{border:1px solid #dfe0e3;background:#fff;color:var(--ink)}.small{min-height:35px;padding:7px 9px;font-size:12px}.textbutton{background:none;color:#6e737b;font-size:13px;padding:6px}.hint,.sub{color:var(--muted)}.hint{font-size:13px}.sub{font-size:12px;line-height:1.65}.center{text-align:center}.titleblock{text-align:center;margin-top:max(70px,12vh)}h1{font-weight:500;font-size:41px;letter-spacing:.10em;margin:0 0 12px;text-indent:0;text-align:center;transform:translateX(3px)}.titleblock p{font-size:13px;color:#96999e;transform:translateX(clamp(26px,8vw,72px))}.intro{display:flex;flex-direction:column;gap:12px;margin:auto 0;width:100%}.intro label{font-size:13px;color:#666}.intro input,.joinrow input{width:100%;border:1px solid var(--line);border-radius:11px;padding:14px;background:#fafafa;outline-offset:2px}.joinrow{display:flex;gap:8px}.joinrow button{white-space:nowrap}.footerlinks{display:flex;justify-content:center;gap:24px;align-items:center;margin-bottom:22px}.footerlinks a{font-size:13px;color:#777}
.nav{height:55px;display:grid;grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr);align-items:center;column-gap:6px}.nav strong{font-weight:500;letter-spacing:.08em;text-align:center;justify-self:center;white-space:nowrap;transform:translateX(2px)}.nav>.back{justify-self:start}.nav>.textbutton,.nav>.navfiller,.nav>.navtools{justify-self:end}.navtools{display:flex;align-items:center;justify-content:flex-end;gap:3px;min-width:0}.navtools>.textbutton{flex-shrink:0}.navtools>.sound-toggle{font-size:11px;padding:6px 3px;white-space:nowrap;color:#4b586c}.navtools>.sound-toggle[aria-pressed="false"]{color:#9a9da4}.back{font-size:30px;background:transparent;padding:1px 8px;line-height:1.1}.navfiller{width:24px}.caption{font-size:13px;color:#757b82;margin:14px 0 10px}.caption.spaced{margin-top:22px}.roommeta{margin:15px 0 8px;padding:15px;border-radius:13px;background:#f9f9f8;display:flex;justify-content:space-between;gap:12px;align-items:center}.roommeta small{font-size:11px;color:#92969b;display:block}.roommeta strong{font-size:22px;letter-spacing:.15em}.rolechooser{display:flex;align-items:center;justify-content:space-evenly}.arrow{border:1px solid var(--line);width:43px;height:43px;border-radius:50%;background:#fff;font-size:28px;color:#444}.largeToken{width:102px;height:102px;border:7px solid var(--red);background:#fff;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:650}.colors{display:flex;gap:15px;justify-content:center}.colorButton{border-radius:50%;height:35px;width:35px;background:var(--color);border:3px solid white;outline:1px solid #dedede}.colorButton.chosen{outline:2px solid var(--color);outline-offset:3px}.colorButton:disabled{opacity:.23}.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.seat{background:#fafafa;border:1px solid #efefef;border-radius:12px;display:flex;align-items:center;gap:8px;padding:10px;min-width:0;font-size:12px}.seat .tiny{flex-shrink:0}.seatname{overflow:hidden;white-space:no .playerstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:7px 0 16px}.playerchip{border:1px solid transparent;background:#f8f8f8;border-radius:12px;padding:8px 0 7px;text-align:center;min-width:0;font-size:11px}.playerchip{position:relative}
.playerchip.turn{border-color:transparent;background:color-mix(in srgb,var(--color) 8%,white);box-shadow:0 0 0 1.3px color-mix(in srgb,var(--color) 45%,white),0 0 14px color-mix(in srgb,var(--color) 25%,transparent)}
.playerchip.turn::before{content:"";position:absolute;top:-11px;left:calc(50% - 6px);border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--color);animation:turnPointer 1.15s ease-in-out infinite}
@keyframes turnPointer{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.playerchip.done{opacity:.65}.playerchip .tiny{margin:auto auto 4px}.playerchip small{color:#9c9c9c;display:block;white-space:nowrap}.boardwrap{position:relative;width:100%;aspect-ratio:1;background:#fafafa;flex-shrink:0}.boardart,#pieces{width:100%;height:100%;position:absolute;inset:0;display:block}.boardart{object-fit:contain;pointer-events:none}#pieces{overflow:visible}.piece{cursor:default}.piece.available{cursor:pointer}.piece .halo{animation:halo 1.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.piece .pointer{animation:float 1.1s ease-in-out infinite;transform-box:fill-box}.piece text{pointer-events:none;font-family:system-ui,sans-serif;font-weight:750;user-select:none}@keyframes halo{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.12)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.piece .halo,.piece .pointer,.playerchip.turn::before{animation:none}}
/* Leave a consistent 5% margin for the four team-color launch circles. */
.boardwrap .boardart,.boardwrap #pieces{inset:5%;width:90%;height:90%}
#pieces .launch-circle{filter:drop-shadow(0 1px 2px #0000000d)}
.boardselection{font-size:13px;line-height:1.5;text-align:left;color:#747982;padding:8px 2px 0;white-space:nowrap}
.boardselection strong{font-weight:700;color:var(--selected-color,#747982);text-shadow:0 1px 1px #00000014}
.boardselection + .gametext{margin-top:10px}
.bubble{position:absolute;display:none;z-index:3;max-width:min(230px,76%);background:#fffdfc;border:2px solid var(--bubble-color,#ef7872);border-radius:13px;padding:10px 13px;font-size:13px;line-height:1.55;color:#30323a;text-align:center;white-space:pre-line;overflow-wrap:anywhere;transform:translate(-50%,calc(-100% - 15px));pointer-events:none;box-shadow:0 7px 22px #3e30301c;backdrop-filter:blur(4px)}
.bubble::after{content:"";position:absolute;bottom:-9px;left:calc(50% - 7px);width:13px;height:13px;transform:rotate(45deg);background:#fffdfc;border-right:2px solid var(--bubble-color,#ef7872);border-bottom:2px solid var(--bubble-color,#ef7872)}
.bubble.below{transform:translate(-50%,15px)}
.bubble.below::after{top:-9px;bottom:auto;transform:rotate(225deg)}.gametext{text-align:center;min-height:58px;margin-top:17px;display:flex;flex-direction:column;gap:4px}.gametext strong{font-size:15px;font-weight:550}.gametext small{font-size:12px;color:#999}.dicearea{margin:auto auto 26px;display:flex;flex-direction:column;align-items:center;gap:14px;perspective:650px}.dice{background:transparent;width:87px;height:87px;display:grid;place-items:center;perspective:650px;position:relative}.cube{display:block;position:relative;width:62px;height:62px;transform-style:preserve-3d;z-index:1}.dice.pivoting::after{content:'';position:absolute;left:50%;top:calc(50% + 32px);width:25px;height:8px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#28313c35 0%,#28313c12 48%,transparent 76%);pointer-events:none}.face{position:absolute;inset:0;border-radius:10px;background:#fff;border:1px solid #d3d6dc;box-shadow:inset -4px -4px 8px #00000012;backface-visibility:hidden}.front{transform:translateZ(31px)}.back{transform:rotateY(180deg) translateZ(31px)}.right{transform:rotateY(90deg) translateZ(31px)}.left{transform:rotateY(-90deg) translateZ(31px)}.top{transform:rotateX(90deg) translateZ(31px)}.face.bottom{transform:rotateX(-90deg) translateZ(31px)}.pip{position:absolute;width:10px;height:10px;background:#33373d;border-radius:50%;transform:translate(-50%,-50%)}.bottomgame{text-align:center;margin-bottom:15px}
.result{align-items:center;justify-content:flex-start;padding-top:max(38px,calc(env(safe-area-inset-top) + 34px));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.result h2{font-weight:500;letter-spacing:.2em;margin:0;font-size:29px}
.art-placeholder{width:min(240px,62vw);aspect-ratio:1 / 1;flex-shrink:0;background:#fafafa;border:1px dashed #d4d4d4;margin:clamp(26px,6vh,56px) auto 0;border-radius:9px;display:grid;place-content:center;text-align:center;color:#a3a6ab;font-size:12px}
.rank{margin-top:clamp(22px,4vh,34px);font-size:21px;white-space:nowrap}.rank strong{font-size:30px;font-weight:500}
.result-note{font-size:12px;color:#96999e;text-align:center;margin-top:12px}
.result .bottom{width:100%;padding-top:20px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(max-height:680px){.result{padding-top:max(20px,env(safe-area-inset-top))}.art-placeholder{width:min(195px,53vw);margin-top:18px}.rank{margin-top:16px}.result .bottom{padding-top:12px;padding-bottom:10px}}
.toast{pointer-events:none;position:fixed;bottom:5vh;left:50%;transform:translateX(-50%);z-index:12;color:white;background:#333d;padding:10px 16px;border-radius:9px;font-size:12px;opacity:0;transition:opacity .25s;max-width:85vw}.toast.show{opacity:1}.shade{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:7;padding:22px}.shade.open{display:flex}.dialog{max-width:390px;width:100%;border-radius:14px;background:white;padding:23px}.dialog h3{font-size:18px}.dialog #dlgText{font-size:13px;line-height:1.8;color:#666}.dialogActions{display:flex;gap:12px;margin-top:22px}.dialogActions button{flex:1}
@media(min-width:700px){body{padding:20px}main{border:1px solid #e8e8e7;border-radius:22px;overflow:hidden;min-height:820px}.screen{min-height:820px}}@media(max-height:750px){.titleblock{margin-top:38px}.rolechooser .largeToken{width:82px;height:82px}.caption{margin:10px 0 7px}.boardwrap{margin-top:0}.playerstrip{margin-bottom:8px}.gametext{margin-top:7px}.dicearea{margin-bottom:10px;gap:7px}.seats{gap:4px}.botrow{margin-top:6px}.bottom{padding-bottom:10px}}

/* Room-start action remains visible even on small mobile screens. */
#lobby{padding-bottom:133px}
#lobby>.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:5;
 width:min(450px,100%);margin:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
 background:#fff;border-top:1px solid #ededed;box-shadow:0 -8px 20px #00000009}
#lobby .bottom .textbutton{min-height:29px}

/* Mobile play: wide touch targets and reliable room sharing without changing board artwork. */
[hidden]{display:none!important}
.shareSettings{padding:10px 13px 6px;background:#fafafa;border:1px solid #ececef;border-radius:12px;margin:0 0 5px}
.shareSettings label{display:block;font-size:12px;color:#777;margin-bottom:6px}
.shareSettings select{width:100%;min-height:42px;border:1px solid #dedfe0;border-radius:9px;background:white;padding:7px;font-size:14px}
.shareSettings p{margin:6px 0 4px}
.inviteNotice{margin:0;padding:8px 12px;font-size:12px;border-radius:9px;background:#f1f7ff;color:#4973a2}
#pieces .piece.available{touch-action:manipulation}
#pieces .piece.available:focus-visible .halo{stroke:#333;stroke-width:6}
button{touch-action:manipulation}
input,select{font-size:16px}
@media(max-width:480px){
 main{max-width:none}
 .screen{padding-left:clamp(8px,3vw,16px);padding-right:clamp(8px,3vw,16px)}
 .playerstrip{margin:12px 0 9px;gap:4px}
 .playerchip{padding:6px 0;min-width:0;font-size:11px}
 .playerchip .tiny{width:29px;height:29px}
 .boardwrap{width:100%;margin:0 auto;max-width:100%}
 .gametext{min-height:43px;margin-top:10px}
 .dicearea{margin:16px auto 13px;gap:4px;flex-direction:row;justify-content:center;min-height:79px}
 .dicearea .dice{height:75px;width:79px}
 .bottomgame{margin-bottom:9px}
 #lobby>.bottom{width:100%;padding-left:14px;padding-right:14px}
}
@media(max-width:380px){
 .screen{padding-left:9px;padding-right:9px}
 .seat{padding:7px}
 .playerchip .seatname{font-size:10px}
 .bottomgame{font-size:11px}
}

/* Offline uses the same screens as the multiplayer page. */
#lobby .roommeta,#lobby .shareSettings{display:none!important}
.seatlabels{min-width:0;flex:1}
.seatlabels .seatrole{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seatlabels .seatname{color:#878b91;font-size:11px;margin-top:2px}
.playerchip .seatrole{font-weight:600}
.playerchip small{overflow:hidden;text-overflow:ellipsis;padding:0 2px}

/* Quiet-looking but clearly accessible sound preview on both screens. */
.sound-test-row{display:flex;justify-content:center;align-items:center;margin:3px 0 4px}
.sound-test-row>.textbutton{color:#536980;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:7px 12px}
.footerlinks{flex-wrap:wrap;gap:10px 18px}

/* Audio repair is an unobtrusive action: it restarts only Web Audio, never the game. */
.sound-test-row{flex-wrap:wrap;gap:4px 10px}
.textbutton.sound-repair{font-size:12px;color:#557a93;text-decoration:underline;text-underline-offset:3px;white-space:normal;line-height:1.4}

/* First-place continuation voting: fade in above the board without reloading. */
.continue-prompt{position:fixed;inset:0;z-index:35;background:rgba(25,29,38,.48);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .48s ease}
.continue-prompt.open{opacity:1;pointer-events:auto}
.continue-card{width:min(100%,400px);border-radius:20px;background:#fff;box-shadow:0 20px 65px #1b253a30;padding:25px 20px;text-align:center;transform:translateY(12px);transition:transform .48s ease}
.continue-prompt.open .continue-card{transform:translateY(0)}
.continue-card h3{font-size:20px;font-weight:600;margin:0 0 12px}
.continue-card p{color:#777f88;line-height:1.7;font-size:14px;margin:10px 0}
.continue-actions{display:flex;gap:10px;justify-content:center;margin-top:18px}
.continue-actions button{flex:1;padding:9px;min-width:0}
.continue-actions button:disabled{opacity:.45}
.rank-detail{padding:10px 0 20px;width:100%;max-width:390px;margin:0 auto}
.rank-detail .rank-line{border-bottom:1px solid #eceef1;padding:10px 7px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.rank-detail .rank-line strong{font-weight:600}
.rank-detail .rank-line small{color:#8a8f96}
.textbutton.resume-seat{align-self:center;padding:9px 12px;color:#557a93;text-decoration:underline;text-underline-offset:3px}
.textbutton.settle-now{color:#8e7782}
</style></head>
<body><main>
<section id="welcome" class="screen active">
 <div class="titleblock"><h1>适得棋所</h1><p>——是飞行棋！</p></div>
 <div class="intro">
  <label for="nickname">你的名字</label><input id="nickname" maxlength="16" value="玩家" autocomplete="nickname" placeholder="输入昵称">
  <button id="solo" class="primary">单人游戏</button>
  <button id="create" class="secondary">创建多人房间</button>
  <div class="joinrow"><input id="joinCode" placeholder="输入六位房间码" maxlength="6" aria-label="房间码"><button id="join" class="secondary">加入房间</button></div>
  <button id="resumeLast" type="button" class="textbutton resume-seat" hidden>返回上次的房间（接管原来的棋子）</button>
  <p id="inviteNotice" class="inviteNotice" hidden>功能维修中~</p>
  <p class="sub">单人可选 1～3 个电脑。房间模式暂时维护中。</p>
 </div>
 <div class="footerlinks"><button id="rulesHome" class="textbutton">游戏规则</button><button id="soundRepairHome" class="textbutton sound-repair" type="button" title="只修复声音播放，不刷新页面">没有音效？点此刷新</button></div>
</section>
<section id="lobby" class="screen">
 <header class="nav"><button id="exitLobby" class="back" aria-label="返回">‹</button><strong>游戏准备</strong><span class="navfiller"></span></header>
 <div class="roommeta"><div><small>房间号码</small><strong id="codeText">------</strong></div><button id="copyInvite" class="secondary small">复制邀请链接</button></div>
 <div class="shareSettings" id="shareSettings" hidden><label for="lanAddress">手机同 Wi-Fi 邀请地址</label><select id="lanAddress" aria-label="选择电脑的局域网地址"></select><p id="networkHint" class="sub"></p></div>
 <div class="caption">我的角色</div><div class="rolechooser"><button id="prevRole" class="arrow">‹</button><div class="largeToken" id="myToken">?</div><button id="nextRole" class="arrow">›</button></div><p id="myRole" class="center hint">随机角色</p>
 <div class="caption">我的棋子外框颜色</div><div id="myColors" class="colors"></div>
 <div class="caption spaced">本局座位</div><div id="seats" class="seats"></div>
 <div id="botControl" class="botcontrols"><div class="botheader"><strong>电脑设置</strong><label>数量 <select id="botCount"></select></label></div><div id="botEditors"></div></div>
 <p id="lobbyHint" class="sub"></p>
 <div class="bottom"><button id="startGame" class="primary">开始游戏</button><button id="leave" class="textbutton">返回主页</button></div>
</section>
<section id="game" class="screen">

  if(pos===GOAL || !Number.isInteger(roll) || roll<1 || roll>6 || pos<LAUNCH || pos>GOAL) return null;

        else if(step.kind==='飞跃'&&enemy.color===crossedLane[actor.color]&&ep===LANE+2)crossing.push(i);
      }

      if(landed.length&&ownAtStop===landed.length){
        for(const i of landed)enemy.pieces[i]=-1;
        hits+=landed.length;
      }
      // Flying across an opponent's goal lane is a separate interception.
      // One flying piece can intercept one lane piece, but not a whole stack.

function distanceLeft(pos){return pos===GOAL?0:pos===-1?57:pos===LAUNCH?56:Math.max(0,GOAL-pos);}

 if(room.phase==='over')return;

  const ga=a.pieces.filter(x=>x===GOAL).length,gb=b.pieces.filter(x=>x===GOAL).length;
  if(ga!==gb)return gb-ga;
  const nearestA=Math.min(...a.pieces.filter(x=>x!==GOAL).map(distanceLeft));
  const nearestB=Math.min(...b.pieces.filter(x=>x!==GOAL).map(distanceLeft));
  if(nearestA!==nearestB)return nearestA-nearestB;
  const da=a.pieces.reduce((sum,x)=>sum+distanceLeft(x),0);
  const db=b.pieces.reduce((sum,x)=>sum+distanceLeft(x),0);
  if(da!==db)return da-db;
  return b.pieces.reduce((max,x)=>Math.max(max,x),-1)-a.pieces.reduce((max,x)=>Math.max(max,x),-1)||a.color-b.color;

function finishVoteIfReady(room){

function autoChoose(room,p){

function advance(room){

  let next=room.turn;

function performMove(room,p,id){

  const travelMs=plan.path.reduce((ms,step)=>ms+(step.kind==='飞跃'?260:step.kind==='跳格'?230:140),0);
  const duration = Math.max(850,travelMs+530);

    if(room.phase!=='playing'||room.roundPhase!=='moving')return;

    if(room.finishOrder.length===room.players.length){advance(room);return;}
    if(room.die===6&&!p.finished){room.roundPhase='roll';room.options=[];room.note=`${p.name} 可以再掷一次`;publish(room);runAI(room);}

// Keep the result visible after the trimmed 2.56 s sound and 2.45 s animation.
const ROLL_REVEAL_MS=3350;
function roll(room,p){

  const rollSeq=room.lastRoll.seq;
  room.sixStreak=n===6?room.sixStreak+1:0;
  const overSix=room.sixStreak>=3;
  if(overSix)p.pieces=p.pieces.map(v=>v===GOAL?GOAL:-1);
  room.options=overSix?[]:available(p,n);
  const resultNote=overSix?`${p.name} 连续三次掷出 6，未完成棋子回基地`:
    room.options.length?`${p.name} 掷出了 ${n} 点`:`${p.name} 掷出 ${n} 点，没有可移动的棋子`;
  room.roundPhase='rolling';
  room.note=`${p.name} 正在掷骰子`;

  setTimeout(()=>{
    if(room.phase!=='playing'||room.roundPhase!=='rolling'||room.turn!==p.color||room.lastRoll?.seq!==rollSeq)return;
    room.note=resultNote;
    if(!room.options.length){
      if(n===6&&!overSix){room.roundPhase='roll';publish(room);runAI(room);}
      else advance(room);

    }
    room.roundPhase='choose';publish(room);

      if(room.phase==='playing'&&room.roundPhase==='choose'&&room.turn===p.color){

  }

    if(data.color!==undefined){

      if(r.players.some(p=>p.color===c)||r.bots.some((b,i)=>i!==index&&b.color===c))fail('这个颜色已被占用');

    publish(r);return {ok:true};
  }
  if(type==='start'||type==='replay'){
    if(data.token!==r.host)fail('只有房主能开始游戏');
    if(type==='start'&&r.phase!=='lobby')fail('本局已经开始');
    if(type==='replay'&&r.phase!=='over')fail('本局尚未结束');

    const humans=r.players.filter(pl=>pl.kind==='human');
    if(humans.length+r.bots.length<2)fail('至少需要两方玩家或电脑');

    for(const pl of humans){pl.pieces=Array(4).fill(-1);pl.finished=false;pl.auto=!!pl.auto;if(pl.role==='?')pl.role=roles[rand(roles.length)];}
    for(const spec of r.bots)r.players.push({token:null,name:roleName(spec.role==='?'?roles[0]:spec.role),color:spec.color,role:spec.role==='?'?roles[rand(roles.length)]:spec.role,kind:'ai',pieces:Array(4).fill(-1),finished:false,connections:1});
    r.players.sort((a,b)=>a.color-b.color);for(const pl of r.players)if(pl.kind==='ai')pl.name=roleName(pl.role);r.phase='playing';r.roundPhase='roll';r.turn=r.players[0].color;r.die=null;r.sixStreak=0;r.options=[];r.finishOrder=[];r.vote=null;r.voteHandled=false;r.lastRoll=null;r.lastMove=null;r.note='游戏开始';publish(r);runAI(r);return {ok:true};
  }
  if(type==='roll'){if(p.auto)fail('当前座位由电脑托管，请先重新接管');if(p.color!==r.turn)fail('不是你的回合');roll(r,p);return {ok:true};}
  if(type==='move'){if(p.auto)fail('当前座位由电脑托管，请先重新接管');if(p.color!==r.turn)fail('不是你的回合');performMove(r,p,Number(data.piece));return {ok:true};}
  fail('未知操作');
}

window.OfflineEngine={
 perform(data){
  const result=handleAction(data);

  const room=rooms.get(cleanCode(info.code));

};

// Original two-note retro coin chime. Synthesized locally; no external or copyrighted audio file.
const SOUND_PREF='flight-goal-sound';
let goalSoundEnabled=true,goalAudio=null;
try{goalSoundEnabled=localStorage.getItem(SOUND_PREF)!=='off';}catch{}
function prepareGoalAudio(){
 if(!goalSoundEnabled)return null;
 const Context=window.AudioContext||window.webkitAudioContext;
 if(!Context)return null;
 try{
  if(!goalAudio||goalAudio.state==='closed')goalAudio=new Context();
  if(goalAudio.state==='suspended')goalAudio.resume().catch(()=>{});
  return goalAudio;
 }catch{return null;}
}
function playGoalChime(){
 const audio=prepareGoalAudio();if(!audio||!goalSoundEnabled)return;
 const now=audio.currentTime+0.012;
 for(const [pitch,delay,duration,volume] of [[987.77,0,0.110,0.095],[1318.51,0.095,0.185,0.090]]){
  const oscillator=audio.createOscillator(),envelope=audio.createGain(),t=now+delay;
  oscillator.type='square';oscillator.frequency.setValueAtTime(pitch,t);
  envelope.gain.setValueAtTime(0.0001,t);
  envelope.gain.exponentialRampToValueAtTime(volume,t+0.006);
  envelope.gain.exponentialRampToValueAtTime(0.0001,t+duration);
  oscillator.connect(envelope);envelope.connect(audio.destination);
  oscillator.start(t);oscillator.stop(t+duration+0.012);
 }
}
// A crisp 65 ms pop per actual piece landing, kept separate from the goal chime.
function playStepPop(){
 const audio=prepareGoalAudio();if(!audio||!goalSoundEnabled)return;
 try{
  const t=audio.currentTime+0.004;
  const oscillator=audio.createOscillator(),envelope=audio.createGain();
  oscillator.type='triangle';
  oscillator.frequency.setValueAtTime(950,t);
  oscillator.frequency.exponentialRampToValueAtTime(590,t+0.055);
  envelope.gain.setValueAtTime(0.0001,t);
  envelope.gain.exponentialRampToValueAtTime(0.75,t+0.003);
  envelope.gain.exponentialRampToValueAtTime(0.0001,t+0.065);
  oscillator.connect(envelope);envelope.connect(audio.destination);
  oscillator.start(t);oscillator.stop(t+0.070);
 }catch{}
}
// Tiny tabletop dice rattle, ending with a deeper landing click. No external audio assets.
function playDiceTap(landing=false){
 const audio=prepareGoalAudio();if(!audio||!goalSoundEnabled)return;
 try{
  const t=audio.currentTime+0.004;
  const oscillator=audio.createOscillator(),envelope=audio.createGain();
  const duration=landing?0.105:0.050;
  oscillator.type='triangle';
  oscillator.frequency.setValueAtTime(landing?410:690,t);
  oscillator.frequency.exponentialRampToValueAtTime(landing?230:430,t+duration*0.85);
  envelope.gain.setValueAtTime(0.0001,t);
  envelope.gain.exponentialRampToValueAtTime(landing?0.115:0.082,t+0.004);
  envelope.gain.exponentialRampToValueAtTime(0.0001,t+duration);
  oscillator.connect(envelope);envelope.connect(audio.destination);
  oscillator.start(t);oscillator.stop(t+duration+0.008);
 }catch{}
}

let diceShakeAudio=null;
function stopDiceShake(){
 if(!diceShakeAudio)return;
 try{diceShakeAudio.pause();diceShakeAudio.currentTime=0;}catch{}
}
function playRecordedDiceShake(){
 if(!goalSoundEnabled||typeof Audio!=='function')return false;
 try{
  if(!diceShakeAudio){
   const player=new Audio(DICE_SHAKE_DATA);
   player.preload='auto';
   if(typeof player.canPlayType==='function'&&!player.canPlayType('audio/mpeg'))return false;
   diceShakeAudio=player;
  }
  stopDiceShake();
  diceShakeAudio.volume=1;
  // Trimmed recording starts audibly right away; keep its natural pace.
  diceShakeAudio.playbackRate=1;
  const started=diceShakeAudio.play();
  if(started&&typeof started.catch==='function')started.catch(()=>{if(goalSoundEnabled)playDiceTap(true);});
  return true;
 }catch{return false;}
}
function refreshSoundEngine(){
 const Context=window.AudioContext||window.webkitAudioContext;
 if(!Context){toast('当前浏览器不支持游戏音效');return;}
 let fresh;
 try{fresh=new Context();}catch{
  toast('无法重新启动音效，请检查浏览器的声音权限');return;
 }
 stopDiceShake();diceShakeAudio=null;
 const old=goalAudio;
 goalAudio=fresh;
 const serial=++soundRefreshSerial;
 if(!goalSoundEnabled){
  goalSoundEnabled=true;
  try{localStorage.setItem(SOUND_PREF,'on');}catch{}
  refreshSoundToggle();
 }
 // Retire the old audio engine asynchronously; game turns and animations keep running.
 if(old&&old!==fresh&&old.state!=='closed'){
  try{Promise.resolve(old.close()).catch(()=>{});}catch{}
 }
 let started;
 try{started=fresh.state==='suspended'?fresh.resume():Promise.resolve();}
 catch(e){started=Promise.reject(e);}
 Promise.resolve(started).then(()=>{
  if(serial!==soundRefreshSerial||goalAudio!==fresh)return;
  if(fresh.state!=='running'){
   toast('音效未能启动，请检查设备音量与浏览器声音设置');return;
  }
  playStepPop(); // short audible confirmation, no interruption of the active turn
  toast('音效已刷新，当前棋局不会重置');
 }).catch(()=>{
  if(serial===soundRefreshSerial&&goalAudio===fresh)
   toast('音效启动失败，请检查浏览器的声音权限');
 });
}
function refreshSoundToggle(){
 const button=$('soundToggle');if(!button)return;

  svg('circle',{cx,cy,r:18,fill:'#fffdf9',stroke:COLOR[color].hex,'stroke-width':3,class:'launch-circle','pointer-events':'none'},node);
 }
 const packs=new Map();
 for(const p of state.players)for(let id=0;id<4;id++){
  const pos=piecePosition(p,id);if(pos===GOAL)continue;
  const [x,y]=point(p.color,pos,id),key=`${x},${y}`;
  if(!packs.has(key))packs.set(key,[]);
  packs.get(key).push({p,id,pos,x,y});
 }
 for(const pack of packs.values())for(let i=0;i<pack.length;i++){
  const {p,id,x,y}=pack[i];const count=pack.length;
  const colCount=Math.ceil(Math.sqrt(count));

  const packed=count>1, spacing=packed?30:0;

  const dx=packed?(i%colCount-(colCount-1)/2)*spacing:0;
  const dy=packed?(Math.floor(i/colCount)-(Math.ceil(count/colCount)-1)/2)*spacing:0;

 }
}

 placeCube(n); // Instantly reveal the final face, without landing or fade animation.
 // The server still holds this face on screen before progressing.
 $('diceStatus').textContent=`${n} 点`;
}
async function animateMove(move){$('bubble').style.display='none';const mine=++animationSerial;animPiece={color:move.color,id:move.piece,pos:move.start};drawPieces();
 for(let k=0;k<move.path.length;k++){
  const step=move.path[k];await sleep(step.kind==='飞跃'?260:step.kind==='跳格'?230:140);
  if(mine!==animationSerial)return;
  animPiece.pos=step.pos;drawPieces();
  if(k===move.path.length-1&&step.pos===GOAL)playGoalChime();
   else playStepPop();
 }
 await sleep(100);if(mine!==animationSerial)return;animPiece=null;drawPieces();
 if(move.hit&&move.dialogue){const [x,y]=point(move.color,move.path.at(-1).pos,move.piece);const b=$('bubble');b.textContent=move.dialogue;b.style.setProperty('--bubble-color',COLOR[move.color]?.hex||'#ef7872');b.style.left=`${Math.max(35,Math.min(65,5+x/900*90))}%`;b.style.top=`${5+y/900*90}%`;b.classList.toggle('below',y<190);b.style.display='block';setTimeout(()=>{if(mine===animationSerial)b.style.display='none';},2700);}
}
function rules(){dialog('游戏说明','每方四枚棋子，掷出6可从基地进入棋盘外的起飞圈，并能再掷一次；起飞圈里的棋子下次掷骰进入棋盘时，紧邻起飞圈的斜三角格算第1格，后面的棋格依次计数。棋子到本色转弯格后进入6格终点道，最里面第6格即终点。落在本色格可向前跳4格；直接落在飞跃格时飞跃。每次掷骰最多触发一次跳格或飞跃，跳到飞机格不再连锁飞跃。走到对手占据的格子时，双方棋子数量不同时可并排共存；相等时把该对手的整组棋子撞回基地（单枚对单枚同样有效）。飞跃经过交叉处时，仍可撞回对方终点道里的单枚棋子。到终点必须刚好，超点折返。连续掷出三个6，未完成棋子回基地。\n\n真人角色可以重复，但颜色不重复。电脑角色与颜色由房主设置。第一名产生后，会询问所有在场真人是否继续比赛；全员同意才会继续，已完成的玩家观战，电脑不投票。可以提前结束并结算，剩余玩家按已进终点的棋子数、再按剩余距离决定排名。对局中离开由电脑暂时接管，返回原设备的房间可以恢复自己的座位。');}
$('rulesHome').onclick=rules;$('gameRules').onclick=rules;
