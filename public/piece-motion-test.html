<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>适得棋所 · 全角色棋子动态测试</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#303741;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px 12px 48px}
main{max-width:650px;margin:auto;background:#fff;padding:22px;border:1px solid #e4e7ec;border-radius:20px;box-shadow:0 8px 30px #252b360a}
a{color:#48769b;text-decoration:none;font-size:13px}h1{font-size:23px;margin:16px 0 8px}
p,.hint{color:#687484;font-size:13px;line-height:1.75}
.board{position:relative;width:100%;aspect-ratio:1;margin:16px 0;border:1px solid #e2e6ec;border-radius:13px;overflow:hidden;background:#f9fafc}
.board img,.board svg{position:absolute;inset:0;width:100%;height:100%}
.board img{object-fit:contain}.board svg{overflow:visible}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{border:1px solid #ccd5df;background:#fff;border-radius:11px;padding:10px 17px;cursor:pointer;color:#33465a;font:inherit}
button.primary{background:#476f9c;color:#fff;border-color:#476f9c}
button:disabled{opacity:.55;cursor:not-allowed}select{font:inherit;border:1px solid #ccd5df;border-radius:9px;padding:7px 10px;background:#fff;color:#33465a;max-width:100%}
.controls{background:#f6f8fb;border-radius:13px;padding:14px;margin-top:14px}
.control{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-bottom:5px}
input[type=range]{width:100%;accent-color:#587fa8;margin:8px 0 12px}
.samples{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sample{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #e7eaf0;border-radius:13px;min-width:0}
.sample svg{width:65px;height:65px;flex:none}
.sample strong{font-size:13px}.sample small{display:block;color:#87919e;font-size:12px;margin-top:4px}
#status{font-size:13px;color:#476f9c;min-height:22px}
.hint{background:#fff9ef;border:1px solid #f2e8d5;border-radius:12px;padding:10px 12px;margin-top:12px}
@media(max-width:420px){main{padding:15px}.sample{gap:5px}.sample svg{width:50px;height:50px}}
</style></head>
<body><main>
<a href="/">‹ 返回游戏</a>　<a href="/piece-preview.html">查看原有棋子试装</a>
<h1>全角色 · 棋子移动放大测试</h1>
<p>全部八名角色都采用同一套走棋尺寸：静止 60，移动 85，落地恢复 60。棋子底盘使用柔和淡彩，描边使用各自同色系深色；无立绘的角色仍保留文字棋子，波波亚原图不变。</p><div class="row"><label for="role">测试角色</label><select id="role"><option value="A">青栖禾</option><option value="B">澄</option><option value="C">勒尔斯</option><option value="D">麦冬</option><option value="E" selected>波波亚</option><option value="F">麻特</option><option value="G">塔努利安</option><option value="H">亚洛</option></select></div>
<div class="samples">
<div class="sample"><svg id="restSample" viewBox="-55 -55 110 110"></svg><div><strong>静止状态</strong><small>60 单位</small></div></div>
<div class="sample"><svg id="moveSample" viewBox="-55 -55 110 110"></svg><div><strong>移动状态</strong><small id="moveLabel">85 单位</small></div></div>
</div>
<div class="board">
<img src="/board.svg" alt="正式游戏棋盘">
<svg id="board" viewBox="0 0 900 900" aria-label="八名角色棋子沿棋盘移动的动态演示"></svg>
</div>
<div class="row">
<button class="primary" id="play">播放走棋动画</button>
<button id="reset">复位</button>
<span id="status" aria-live="polite">待机 · 60 单位</span>
</div>
<div class="controls">
<label for="moveSize" class="control"><span>移动时的棋子直径</span><output id="sizeValue">85 单位</output></label>
<input type="range" id="moveSize" min="65" max="110" step="5" value="85">
<label for="speed" class="control"><span>逐格移动速度</span><output id="speedValue">140 毫秒/格</output></label>
<input type="range" id="speed" min="80" max="300" step="20" value="140">
</div>
<div class="hint">这个页面独立测试棋子外观和移动节奏；不会改动正式房间的对局数据。当前游戏采用固定的 60 → 85 → 60，滑块仅用于比较效果。</div>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg', IMAGE='/assets/popoya-original.png?v=popoya-7b365e61961d';
const COLORS={red:'#F2A7A7',yellow:'#F4DEA0',green:'#A9D8B0',blue:'#A9CFF3'};
const EDGES={red:'#9B4D59',yellow:'#896424',green:'#417954',blue:'#416F9C'};
const EDGE_BY_BASE=Object.fromEntries(Object.keys(COLORS).map(k=>[COLORS[k].toLowerCase(),EDGES[k]]));
const MARKS={A:'禾',B:'澄',C:'勒',D:'麦',F:'麻',G:'塔',H:'亚'};
const PATH=[[608,92],[625,150],[625,200],[608,258],[642,292],[700,275],[750,275],[808,292]];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function svg(tag,attrs,parent){
 const node=document.createElementNS(NS,tag);
 for(const [key,value] of Object.entries(attrs))node.setAttribute(key,String(value));
 parent.appendChild(node);return node;
}
function drawToken(parent,diameter,hex){
 const g=svg('g',{},parent),radius=diameter/2,ratio=diameter/60,role=$('role').value;
 if(role==='E'){
  const border=3.2*ratio,artRadius=26*ratio;
  svg('circle',{r:radius-border/2,fill:hex,stroke:EDGE_BY_BASE[hex.toLowerCase()],'stroke-width':border},g);
  svg('image',{href:IMAGE,x:-artRadius,y:-artRadius,width:artRadius*2,height:artRadius*2,preserveAspectRatio:'xMidYMid meet','pointer-events':'none'},g);
 }else{
  svg('circle',{r:radius,fill:hex,stroke:EDGE_BY_BASE[hex.toLowerCase()],'stroke-width':5*ratio},g);
  const text=svg('text',{x:0,y:1*ratio,'text-anchor':'middle','dominant-baseline':'central','font-size':22*ratio,fill:'#272a30'},g);
  text.textContent=MARKS[role]||'?';
 }
 return g;
}
const board=$('board');
const otherGroups=[];
for(const [hex,x,y] of [[COLORS.yellow,750,450],[COLORS.green,150,450],[COLORS.blue,450,750]]){
 const g=svg('g',{transform:'translate('+x+' '+y+')'},board);otherGroups.push([g,hex]);
}
const walker=svg('g',{transform:'translate('+PATH[0].join(' ')+')'},board);
let sprite;
function refreshRole(){
 for(const [g,hex] of otherGroups){g.replaceChildren();drawToken(g,60,hex);}
 walker.replaceChildren();sprite=drawToken(walker,60,COLORS.red);
 sprite.style.transformOrigin='center';sprite.style.transformBox='fill-box';sprite.style.transition='transform 165ms ease-out';
 $('restSample').replaceChildren();drawToken($('restSample'),60,COLORS.red);
 $('moveSize').oninput();
}

let moving=false,playing=false,serial=0;
function moveDiameter(){return Number($('moveSize').value);}
function zoom(active){
 moving=active;
 const scale=active?moveDiameter()/60:1;
 sprite.style.transform='scale('+scale+')';
 $('status').textContent=active?'正在移动 · '+moveDiameter()+' 单位':'待机 · 60 单位';
}
function setPos(i){walker.setAttribute('transform','translate('+PATH[i].join(' ')+')');}
function reset(){
 serial++;playing=false;setPos(0);zoom(false);$('play').disabled=false;
}
async function play(){
 if(playing)return;
 playing=true;const run=++serial;
 setPos(0);$('play').disabled=true;zoom(false);
 await sleep(75);if(serial!==run)return;
 zoom(true);await sleep(180);
 for(let i=1;i<PATH.length;i++){
  if(serial!==run)return;
  await sleep(Number($('speed').value));
  if(serial!==run)return;
  setPos(i);
 }
 await sleep(140);if(serial!==run)return;
 zoom(false);await sleep(210);
 if(serial!==run)return;
 playing=false;$('play').disabled=false;
}
$('moveSize').oninput=()=>{
 const n=moveDiameter();
 $('sizeValue').textContent=n+' 单位';$('moveLabel').textContent=n+' 单位';
 $('moveSample').replaceChildren();drawToken($('moveSample'),n,COLORS.red);
 if(moving)zoom(true);
};
$('speed').oninput=()=>$('speedValue').textContent=$('speed').value+' 毫秒/格';
$('play').onclick=play;$('reset').onclick=reset;
$('role').onchange=()=>{reset();refreshRole();};
refreshRole();reset();
</script></body></html>
