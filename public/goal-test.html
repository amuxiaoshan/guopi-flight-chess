<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f8f5">
<title>适得棋所 · 终点音效测试</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f1;color:#30323a}
*{box-sizing:border-box}
body{margin:0;padding:18px 12px 42px}
main{width:min(100%,470px);margin:auto;background:white;border:1px solid #e6e7e9;border-radius:21px;padding:20px 17px 23px;box-shadow:0 9px 35px #0000000a}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
a{color:#5375a1;text-decoration:none;font-size:13px}
h1{font-size:24px;letter-spacing:.06em;font-weight:650;margin:18px 0 7px}
.sub{font-size:13px;color:#7b8190;line-height:1.68;margin:0 0 16px}
.pickers{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin:12px 0}
label{display:block;font-size:13px;color:#666b73;margin-bottom:6px}
select{width:100%;background:#fbfbfc;color:#282d35;border:1px solid #dcdfe5;border-radius:11px;font-size:15px;padding:11px}
.legend{font-size:12px;color:#747982;margin:8px 0 12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.boardwrap{position:relative;width:100%;aspect-ratio:1;margin:3px auto 10px;border-radius:12px;overflow:hidden;background:#fcfaf7}
.boardart,#pieces{position:absolute;inset:0;width:100%;height:100%}
#pieces{pointer-events:none}
.dice{display:flex;align-items:center;justify-content:center;gap:12px;border-radius:12px;background:#f9f9f7;min-height:52px;margin:4px 0 10px}
.dice strong{font-size:30px;line-height:1}
.dice span{font-size:12px;color:#737780;line-height:1.5}
.controls{display:grid;grid-template-columns:1.5fr 1fr;gap:9px;margin:13px 0}
button{font:inherit;border-radius:11px;padding:12px 8px;cursor:pointer;border:1px solid #dfe1e5;min-height:45px}
button:disabled{opacity:.5;cursor:default}
#roll{background:#f3dfc2;color:#45382c;border-color:#ecd1a9;font-weight:650}
#reset{background:#f9f9f9;color:#626776}
#result{font-size:13px;line-height:1.7;padding:11px 12px;border:1px solid #ececef;background:#fafafc;border-radius:11px;min-height:65px}
.listen-title{font-size:13px;font-weight:650;margin:18px 0 9px}
.listen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.listen button{padding:10px 2px;font-size:12px;background:#f9f9fb;color:#444b55;min-height:43px}
.listen button:active{background:#e9ecf3}
.small{font-size:12px;line-height:1.75;color:#8d9199;margin:12px 0 0}
@media(max-width:360px){main{padding:15px 11px}h1{font-size:21px}.pickers{gap:7px}}
</style>
</head>
<body>
<main>
<header><a href="/">‹ 返回正式游戏</a><span style="font-size:11px;color:#9a9fa9">独立测试页</span></header>
<h1>终点音效测试</h1>
<p class="sub">固定位置 · 固定掷出 3 点 · 每次送一枚棋子到终点，按本方第 1～4 枚分别播放对应金币音效。</p>
<div class="pickers">
 <div><label for="role">测试角色</label><select id="role">
<option value="A">青栖禾</option><option value="B">澄</option><option value="C">勒尔斯</option><option value="D">麦冬</option><option value="E">波波亚</option><option value="F">麻特</option><option value="G">塔努利安</option><option value="H">亚洛</option>
</select></div>
 <div><label for="color">测试棋子颜色</label><select id="color">
<option value="3">红方</option><option value="0">蓝方</option><option value="1">黄方</option><option value="2">绿方</option>
</select></div>
</div>
<div class="legend"><i class="dot" id="colorDot" style="background:#ef5350"></i><span id="legendText">红方 · 终点道倒数第四格起步</span></div>
<div class="boardwrap">
<img class="boardart" src="/board.svg" alt="适得棋所飞行棋棋盘">
<svg id="pieces" viewBox="0 0 900 900" role="img" aria-label="固定终点棋子演示"></svg>
</div>
<div class="dice"><strong id="dice">⚀</strong><span>固定骰点：3<br>每次测试同样的最后三格</span></div>
<div class="controls"><button id="roll" type="button">掷出 3 点 · 第 1 枚进终点</button><button id="reset" type="button">重置本方四枚</button></div>
<div id="result" role="status" aria-live="polite">准备完成：红方四枚棋子都在终点道前。点击掷骰开始听 coin1。</div>
<div class="listen-title">直接试听四种终点音效</div>
<div class="listen">
<button type="button" data-audio="1">coin1</button>
<button type="button" data-audio="2">coin2</button>
<button type="button" data-audio="3">coin3</button>
<button type="button" data-audio="4">coin4</button>
</div>
<p class="small">每个颜色单独记录 0～4 枚棋子的终点进度。测试使用正式游戏相同的落子音、音效文件和终点坐标；进入终点后棋子会像正式版一样从棋盘图层移除。不会创建房间，也不影响真实对局。若浏览器当前静音，先取消静音再试听。</p>
</main>

const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const ROLES={
 A:['青栖禾','禾'],B:['澄','澄'],C:['勒尔斯','勒'],D:['麦冬','麦'],
 E:['波波亚','波'],F:['麻特','麻'],G:['塔努利安','塔'],H:['亚洛','亚']
};
const COLORS=[
 {label:'蓝方',key:'blue',hex:'#41a7f5'}, {label:'黄方',key:'yellow',hex:'#f6c945'},
 {label:'绿方',key:'green',hex:'#58c26a'}, {label:'红方',key:'red',hex:'#ef5350'}
];
const LANES={
 red:[[450,150],[450,200],[450,250],[450,300],[450,350],[450,400]],
 blue:[[450,750],[450,700],[450,650],[450,600],[450,550],[450,500]],
 green:[[150,450],[200,450],[250,450],[300,450],[350,450],[400,450]],
 yellow:[[750,450],[700,450],[650,450],[600,450],[550,450],[500,450]]
};
const GOAL=55,START=52,FIXED_DICE=3;
const progress=[0,0,0,0];
let role='A',color=3,movingId=-1,movingPos=START,running=false,version=0;
const pause=ms=>new Promise(done=>setTimeout(done,ms));
const contextType=window.AudioContext||window.webkitAudioContext;
let audioContext=null;
const coinBuffers={};
function activateAudio(){
 if(!contextType)return null;
 try{
  if(!audioContext||audioContext.state==='closed')audioContext=new contextType();
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  return audioContext;
 }catch{return null;}
}
function prepareCoin(ordinal){
 const key='coin'+ordinal,ctx=activateAudio();
 if(!ctx)return Promise.resolve(null);
 if(!coinBuffers[key]){
  try{
   const raw=atob(GAME_SFX[key].split(',')[1]);
   const bytes=Uint8Array.from(raw,ch=>ch.charCodeAt(0));
   coinBuffers[key]=ctx.decodeAudioData(bytes.buffer).catch(e=>{
    console.warn('解码终点音效失败',key,e);delete coinBuffers[key];return null;
   });
  }catch(e){console.warn(e);return Promise.resolve(null);}
 }
 return coinBuffers[key];
}
async function playCoin(ordinal,prepared){
 const buffer=prepared?await prepared:null;
 const ctx=audioContext;
 if(ctx&&buffer){
  try{
   if(ctx.state==='suspended')await ctx.resume();
   const source=ctx.createBufferSource(),gain=ctx.createGain();
   source.buffer=buffer;gain.gain.value=.90;
   source.connect(gain);gain.connect(ctx.destination);source.start(0);
   return;
  }catch(e){console.warn('Web Audio 播放失败',e);}
 }
 try{
  const audio=new Audio(GAME_SFX['coin'+ordinal]);
  audio.volume=.90;
  await audio.play();
 }catch(e){
  console.warn('音效播放失败',e);
  $('result').textContent='音效播放失败，请检查浏览器是否静音或限制自动播放。';
 }
}
function playStepPop(){
 const audio=audioContext;if(!audio||audio.state!=='running')return;
 try{
  const t=audio.currentTime+.004;
  const oscillator=audio.createOscillator(),envelope=audio.createGain();
  oscillator.type='triangle';
  oscillator.frequency.setValueAtTime(950,t);
  oscillator.frequency.exponentialRampToValueAtTime(590,t+.055);
  envelope.gain.setValueAtTime(.0001,t);
  envelope.gain.exponentialRampToValueAtTime(.75,t+.003);
  envelope.gain.exponentialRampToValueAtTime(.0001,t+.065);
  oscillator.connect(envelope);envelope.connect(audio.destination);
  oscillator.start(t);oscillator.stop(t+.070);
 }catch(e){console.warn(e);}
}
function svg(tag,attrs,parent){
 const el=document.createElementNS(NS,tag);
 for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));
 parent.appendChild(el);return el;
}
function lanePos(pos){return LANES[COLORS[color].key][pos-50];}
function draw(){
 const node=$('pieces');node.replaceChildren();
 const waiting=[];
 for(let id=progress[color];id<4;id++)waiting.push({id,pos:id===movingId?movingPos:START});
 const groups=new Map();
 for(const piece of waiting){
  const xy=lanePos(piece.pos),key=xy.join(',');
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push({...piece,xy});
 }
 for(const pack of groups.values())for(let i=0;i<pack.length;i++){
  const n=pack.length,colCount=Math.ceil(Math.sqrt(n)),packed=n>1;
  const dx=packed?(i%colCount-(colCount-1)/2)*30:0;
  const dy=packed?(Math.floor(i/colCount)-(Math.ceil(n/colCount)-1)/2)*30:0;
  const [x,y]=pack[i].xy;
  const g=svg('g',{transform:'translate('+(x+dx)+' '+(y+dy)+')'},node);
  svg('circle',{r:packed?17:24,fill:'white',stroke:COLORS[color].hex,'stroke-width':packed?3.5:5},g);
  const label=svg('text',{x:0,y:1,'font-size':packed?16:22,'text-anchor':'middle','dominant-baseline':'central',fill:'#272a30'},g);
  label.textContent=ROLES[role][1];
 }
 $('colorDot').style.background=COLORS[color].hex;
 $('legendText').textContent=COLORS[color].label+' · 已到终点 '+progress[color]+' / 4 枚';
 $('roll').disabled=running||progress[color]>=4;
 $('roll').textContent=progress[color]>=4?'本方四枚已完成':'掷出 3 点 · 第 '+(progress[color]+1)+' 枚进终点';
 $('role').disabled=running;$('color').disabled=running;$('reset').disabled=running;
}
function reset(){
 if(running)return;
 progress[color]=0;movingId=-1;movingPos=START;version++;
 $('dice').textContent='⚀';
 $('result').textContent=COLORS[color].label+'已重置：四枚棋子都已固定在终点道前。下一次播放 coin1。';
 draw();
}
async function roll(){
 if(running)return;
 if(progress[color]>=4){
  $('result').textContent='本方四枚已完成。点击“重置本方四枚”后可再测。';
  return;
 }
 running=true;movingId=progress[color];movingPos=START;version++;const mine=version;
 const ordinal=progress[color]+1,clip='coin'+ordinal+'.wav';
 // Unlock on the actual click and begin decoding before the first animation delay.
 const prepared=prepareCoin(ordinal);
 $('dice').textContent='⚂';
 $('result').textContent=ROLES[role][0]+' 掷出固定 3 点。第 '+ordinal+' 枚棋子前进中……';
 draw();
 for(let i=1;i<=FIXED_DICE;i++){
  await pause(200);
  if(version!==mine)return;
  movingPos=START+i;
  if(i===FIXED_DICE){
   progress[color]++;
   movingId=-1;
   draw();
   await playCoin(ordinal,prepared);
  }else{
   draw();playStepPop();
  }
 }
 if(version!==mine)return;
 running=false;draw();
 $('result').textContent=COLORS[color].label+'第 '+ordinal+' 枚棋子已到终点，播放 '+clip+'。本方 '+progress[color]+'/4 枚完成。';
}
$('role').addEventListener('change',e=>{role=e.target.value;draw();});
$('color').addEventListener('change',e=>{
 if(running)return;
 color=Number(e.target.value);
 $('dice').textContent='⚀';
 $('result').textContent=COLORS[color].label+'已到终点 '+progress[color]+'/4 枚。下一次是 coin'+Math.min(4,progress[color]+1)+'。';
 draw();
});
$('roll').addEventListener('click',roll);
$('reset').addEventListener('click',reset);
document.querySelectorAll('[data-audio]').forEach(button=>button.addEventListener('click',()=>{
 const ordinal=Number(button.dataset.audio),prepared=prepareCoin(ordinal);
 void playCoin(ordinal,prepared);
 $('result').textContent='正在单独试听 coin'+ordinal+'.wav，不改变任何棋子的状态。';
}));
draw();
</script>
