name: Apply unified character piece movement

on:
  push:
    paths:
      - 'scripts/apply-popoya-motion.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch online and offline movement for every character
        run: python3 scripts/apply-popoya-motion.py
      - name: Validate game JavaScript and inline HTML scripts
        run: |
          node --check public/app.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ('single.html', 'piece-motion-test.html'):
              html = (Path('public') / name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
              assert scripts, 'No scripts found in '+name
              for n, code in enumerate(scripts):
                  Path('/tmp/'+name+'-'+str(n)+'.js').write_text(code,encoding='utf-8')
          PY
          for f in /tmp/single.html-*.js /tmp/piece-motion-test.html-*.js; do node --check "$f"; done
      - name: Test goal pass-through and overshoot rebound
        run: node tests/goal-pass-through.test.js
      - name: Commit game updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/single.html public/piece-preview.html public/piece-motion-test.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply 60-to-85 movement to all character pieces"
            git push
          fi
