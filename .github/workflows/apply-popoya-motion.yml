name: Apply Popoya movement sizing

on:
  push:
    paths:
      - 'scripts/apply-popoya-motion.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch original game and offline version
        run: python3 scripts/apply-popoya-motion.py
      - name: Commit game updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/single.html public/piece-preview.html
          if ! git diff --cached --quiet; then
            git commit -m "Make Popoya pieces 60 at rest and 85 while moving"
            git push
          fi
