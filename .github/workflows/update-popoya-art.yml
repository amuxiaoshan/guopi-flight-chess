name: Update Popoya artwork
on:
  push:
    paths:
      - 'scripts/update_popoya_art.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/update_popoya_art.py
      - name: Commit updated game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/popoya-original.png public/single.html public/app.js public/piece-preview.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Popoya piece artwork with sideburns"
            git push
          fi
